let storageOK=true,progress={done:[],last:0},level=0,filter=null,m=null,state=null,epoch=0,sound=false,audioCtx=null;
const clone=v=>structuredClone(v),escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function cleanProgress(p){if(!p||!Array.isArray(p.done)||p.done.length>1000||!p.done.every(n=>Number.isInteger(n)&&n>=0&&n<1000))throw Error('Format progres tidak sesuai');return{done:[...new Set(p.done)],last:Number.isInteger(p.last)&&p.last>=0&&p.last<1000?p.last:0};}
try{const raw=localStorage.getItem(KEY);if(raw)progress=cleanProgress(JSON.parse(raw));}catch{storageOK=false;}
level=Math.floor(progress.last/200);
function save(){try{localStorage.setItem(KEY,JSON.stringify(progress));storageOK=true;}catch{storageOK=false;}}
function speak(text,force=false){if((sound||force)&&'speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text.replace(/[↑↓←→]/g,c=>({'↑':'atas','↓':'bawah','←':'kiri','→':'kanan'}[c])));u.lang='id-ID';u.rate=.85;speechSynthesis.speak(u);}}
function stop(){cancelDrag();epoch++;if(state)state.busy=false;if('speechSynthesis'in window)speechSynthesis.cancel();}
function setStatus(text,kind=''){const coach=$('#coach');if(coach)coach.innerHTML='';document.querySelectorAll('.clue-focus').forEach(el=>el.classList.remove('clue-focus'));const buddy=$('#bimoBuddy');if(buddy)buddy.dataset.mood=kind==='thinking'?'think':kind==='good'?'happy':'idle';const s=$('#status');if(s){s.textContent=text;s.className='status '+kind;}speak(text);}
function next(){if(!progress.done.includes(progress.last))return progress.last;return E.range(1000).find(id=>!progress.done.includes(id))??0;}
function theme(){return E.themes[m.theme];}function typeInfo(){return E.types.find(t=>t.id===m.type);}
function card(c,{small=false,neutral=false}={}){const o=theme().objects[c.o],co=E.colors[c.c];return `<span class="picture-card ${small?'small':''} ${c.big?'big-picture':''}" role="img" aria-label="${escapeHTML(cardName(c))}" style="--card-color:${neutral?'#eef1e5':co.hex}"><span class="object">${o.icon}</span><span class="color-mark" aria-hidden="true">${co.mark}</span>${c.badge?'<span class="badge-star">★</span>':''}</span>`;}
function cardName(c){return `${theme().objects[c.o].name}, ${E.colors[c.c].name}${m.type==='detective'||m.type==='factory'?', '+(c.big?'besar':'kecil')+(c.badge?', berbintang':', tanpa bintang'):''}`;}
function home(){stop();m=null;state=null;const n=next(),rec=E.make(n),w=E.themes[rec.theme],currentCount=progress.done.filter(id=>Math.floor(id/200)===level).length;app.innerHTML=`<section class="hero"><div><span class="eyebrow">BANYAK CARA BERMAIN. BANYAK CARA BERPIKIR.</span><h1>Hari ini, mau<br><em>menemukan apa?</em></h1><p>Pasangkan, susun, pecahkan misteri, dan ciptakan kode.<br>1.000 petualangan kecil untuk ide-ide besarmu.</p><button class="primary" data-action="resume">${progress.done.length?'Lanjut petualanganku':'Ayo, mulai bermain'} <span>→</span></button><div class="hero-note">🌱 Tanpa timer · Bebas mencoba lagi · Usia 6 tahun + pendamping</div></div><div class="discovery-scene" aria-hidden="true"><span class="scene-note">Aku punya ide! ✨</span><span class="float-card animal">🦁 <i>●</i></span><span class="float-card puzzle">🧩</span><span class="float-card rhythm">🥁</span><div class="robot"><span>• •</span></div><span class="scene-star">✦</span><span class="scene-path">· · · · ·</span><span class="scene-flower">🌼</span></div></section><section class="journey-stats"><div><b>🌟 ${progress.done.length.toLocaleString('id-ID')} <small>/ 1.000</small></b><span>Misi sudah ditemukan</span></div><div class="progress" role="progressbar" aria-label="Misi selesai" aria-valuemin="0" aria-valuemax="1000" aria-valuenow="${progress.done.length}"><i style="width:${progress.done.length/10}%"></i></div><div class="next-card"><small>PETUALANGAN BERIKUTNYA</small><b>${w.icon} ${rec.title}</b><span>${w.name} · misi ${n+1}</span></div></section><section><div class="section-head"><div><span class="eyebrow">SATU HARI, HAL BARU</span><h2>Pilih cara bermain</h2></div><button class="text-button" data-action="alltypes">${filter?'Lihat semua jenis →':'10 jenis permainan'}</button></div><div class="type-grid">${E.types.map(t=>`<button class="type-card ${filter===t.id?'selected':''}" data-action="filter" data-value="${t.id}" aria-pressed="${filter===t.id}"><span>${t.icon}</span><strong>${t.name}</strong><small>${playGuides[t.id][0]}</small></button>`).join('')}</div></section><section class="map-section"><div class="section-head"><div><span class="eyebrow">SEDIKIT DEMI SEDIKIT, MAKIN BISA</span><h2>${filter?E.types.find(t=>t.id===filter).name:'Peta dunia imajinasimu'}</h2><p>20 tema di setiap tingkat. Pilih sesuai kesiapanmu.</p></div><span class="pill">${currentCount} / 200 selesai</span></div><div class="levels" aria-label="Pilih tingkat">${E.levels.map((l,i)=>`<button data-action="level" data-value="${i}" class="level-tab ${level===i?'selected':''}" aria-pressed="${level===i}"><span>${l.icon}</span><div><small>TINGKAT ${i+1}</small><b>${l.short}</b></div></button>`).join('')}</div><p class="level-description"><b>${E.levels[level].name}.</b> ${E.levels[level].description} Semua tingkat terbuka untuk pendamping.</p><div class="worlds">${E.themes.map(w=>{const start=level*200+w.id*10,count=progress.done.filter(id=>id>=start&&id<start+10).length;return `<button class="world-card" data-action="${filter?'open':'chapter'}" data-value="${filter?start+E.types.findIndex(t=>t.id===filter):w.id}"><div class="world-art" style="--tint:${w.tint}"><span class="number">DUNIA ${String(w.id+1).padStart(2,'0')}</span><span class="island">${w.icon}</span><span class="mini-island">${w.objects[(level+1)%4].icon}</span></div><div class="world-body"><h3>${w.name}</h3><p>${filter?E.types.find(t=>t.id===filter).skill:`Misi ${start+1}–${start+10} · 10 cara bermain`}</p><div class="card-bottom"><span>${filter?(progress.done.includes(start+E.types.findIndex(t=>t.id===filter))?'✓ Sudah selesai':'Ayo coba'):`${count} / 10 selesai`}</span><span>→</span></div></div></button>`;}).join('')}</div></section><footer>Setiap percobaan adalah penemuan. Istirahat dulu juga boleh. ♡<br><span>${storageOK?'Progres disimpan di browser ini. Tidak ada akun atau data anak.':'Penyimpanan tidak tersedia. Unduh progres lewat menu orang tua sebelum menutup.'}</span></footer>`;window.scrollTo(0,0);}
function chapter(id){stop();const w=E.themes[id],start=level*200+id*10;app.innerHTML=`<button class="back" data-action="home">← Semua dunia</button><section class="chapter-hero" style="--tint:${w.tint}"><div><span class="eyebrow">TINGKAT ${level+1} · ${E.levels[level].name.toUpperCase()}</span><h1>${w.name}</h1><p>Satu dunia, sepuluh cara berpikir. Mulai dari mana saja.</p></div><span>${w.icon}</span></section><div class="mission-grid">${E.types.map((t,i)=>`<button class="mission-card" data-action="open" data-value="${start+i}"><div class="mission-icon">${t.icon}</div><div><span class="eyebrow">MISI ${start+i+1} ${progress.done.includes(start+i)?'· ✓ SELESAI':''}</span><h3>${t.name}</h3><p>${playGuides[t.id][0]}</p></div><span class="mission-arrow">→</span></button>`).join('')}</div><div class="guide-strip">☀️ Tidak harus selesai sekaligus. Satu misi dapat dimainkan ulang dan dilanjutkan dengan aktivitas tanpa layar.</div>`;window.scrollTo(0,0);}
function initState(){const s={busy:false,selection:null,program:[],fn:[],active:-1};switch(m.type){case'memory':s.matched=m.cards.map(()=>false);s.flipped=[];s.tries=0;break;case'sort':s.answer=m.cards.map(()=>-1);break;case'pattern':s.answer=m.blanks.map(()=>null);s.selection=0;break;case'mosaic':s.answer=[...m.tiles];break;case'matrix':s.answer=[...m.clues];s.selection=m.clues.indexOf(-1);break;case'factory':s.outputs=clone(m.inputs);break;case'route':s.pos=[...m.start];s.stars=[];break;case'music':s.playing=-1;s.heard=[];break;case'detective':s.answer=null;break;case'packing':s.answer=m.cards.map(()=>-1);break;}return s;}
function missionBrief(){if(m.type==='matrix')return 'Isi kotak kosong. Ke samping dan ke bawah, jangan ada gambar kembar. Kotak 🔒 tidak bisa diubah.';if(m.type==='route')return 'Susun panah agar Bimo sampai ke 🚩.'+(m.stars.length?' Di petak ⭐, pakai kartu ambil bintang.':'');if(m.type==='sort'&&!m.ruleText)return 'Lihat nama rumahnya. Seret kartu ke rumah yang cocok.';if(m.type==='mosaic')return 'Seret potongan ke potongan lain. Keduanya akan bertukar tempat. Buat gambar seperti contoh!';if(m.type==='factory')return m.brief+' '+(m.require.includes('repeat')?'Pakai kotak Ulang. ':'')+(m.require.includes('if')?'Pakai mesin Jika merah.':'');if(m.type==='music')return m.brief+' '+(m.require.includes('function')?'Buat dan panggil Jurus Irama.':m.require.includes('repeat')?'Gunakan kotak Ulang.':'');if(m.type==='sort'&&m.ruleText)return 'Masukkan ke rumah Cocok hanya jika: '+m.ruleText+'.';if(m.type==='packing'&&m.counts)return m.brief+' Tiap tas harus berisi 3 bekal.';return m.brief;}
function openMission(id){stop();m=E.make(id);level=m.level;progress.last=id;save();state=initState();const t=typeInfo(),w=theme();app.innerHTML=`<button class="back" data-action="chapter" data-value="${w.id}">← ${w.name}</button><div class="play-top"><div><span class="eyebrow">${w.icon} ${w.name.toUpperCase()} · MISI ${id+1} / 1.000</span><h1>${t.icon} ${t.name}</h1></div><span class="pill">${E.levels[level].icon} Tingkat ${level+1} · ${E.levels[level].short}</span></div>${childGuide()}<div class="instruction"><p id="instruction">${escapeHTML(missionBrief())}</p><button class="listen" data-action="listen" aria-label="Bacakan petunjuk">🔊</button></div><div id="game" class="game game-${m.type}"></div><div class="status" id="status" role="status" aria-live="polite">${initialMessage()}</div><div id="coach"></div><div class="game-actions"><button class="primary" data-action="check" id="check">${['factory','route','music'].includes(m.type)?'▶ Jalankan rencanaku':'✓ Cek jawabanku'}</button><button class="secondary" data-action="hint">💡 Petunjuk kecil</button><button class="secondary" data-action="reset">↶ Coba dari awal</button></div><details class="guide"><summary>☀️ Panduan pendamping · misi ${id+1}</summary><div><p><b>Tujuan:</b> ${t.goal}</p><p><b>Tantangan misi ini:</b> ${escapeHTML(E.describe(m))}</p><p><b>Pemanasan tanpa layar (±5 menit):</b> ${t.off}</p><p><b>Bermain (±10 menit):</b> ${escapeHTML(missionBrief())} Minta anak menebak, mencoba, lalu menjelaskan. Biarkan salah menjadi bahan diskusi.</p><p><b>Cerita kembali (±5 menit):</b> ${t.reflect}</p><p><b>Tantangan kreatif:</b> anak membuat versi sendiri memakai kertas atau benda di rumah, lalu mengajari Anda. Naik tingkat ketika anak dapat menjelaskan caranya; boleh kembali ke tingkat sebelumnya.</p><p>Durasi fleksibel. Satu misi bukan kewajiban satu sesi penuh. Berhenti ketika anak lelah atau mulai tidak menikmati.</p></div></details>`;renderGame();window.scrollTo(0,0);}
function initialMessage(){if(!['memory','mosaic','matrix'].includes(m.type))return playGuides[m.type][0]+' Aku Bimo. Yuk, coba bersama! 🤖';return m.type==='memory'?'Ketuk dua kartu. Ingat gambar DAN warna bingkainya.':m.type==='mosaic'?'Cari sudut dan tepi gambar dulu. Seret satu potongan ke potongan lain untuk menukar.':m.type==='matrix'?'Kotak bergembok adalah petunjuk. Pilih kotak kosong, lalu pilih gambar.':'Lihat dulu, buat rencana, lalu coba. Tidak perlu buru-buru. 🌱';}
function btn(action,value,html,cls='',label=''){return `<button class="${cls}" data-action="${action}" data-value="${value}"${label?` aria-label="${escapeHTML(label)}"`:''}${state.busy?' disabled':''}>${html}</button>`;}
function renderGame(){const g=$('#game');if(!g||!m)return;switch(m.type){
case'memory':g.innerHTML=`<div class="game-meta"><span>🐾 ${state.matched.filter(Boolean).length/2} / ${m.pairs} pasangan</span><span>Gambar sama + warna sama</span></div><div class="memory-board" style="--cols:${m.pairs<=4?4:m.pairs<=6?4:4}">${m.cards.map((c,i)=>{const revealed=state.matched[i]||state.flipped.includes(i);return btn('memory',i,revealed?card(c):'<span class="card-back">?</span>',`memory-tile ${state.matched[i]?'matched':''} ${revealed?'revealed':''}`,revealed?`${cardName(c)}${state.matched[i]?', pasangan ditemukan':''}`:`Buka kartu ${i+1}`);}).join('')}</div><p class="mini-help">Tanda ● ■ ▲ ◆ ikut membedakan warna.</p>`;break;
case'sort':g.innerHTML=`${m.ruleText?`<div class="rule-banner">📋 Aturan: <b>${escapeHTML(m.ruleText)}</b></div>`:''}<div class="tray">${m.cards.map((c,i)=>btn('select',i,card(c)+`<small>${state.answer[i]<0?'Pilih aku':'Rumah '+(state.answer[i]+1)}</small>`,`item-card ${state.selection===i?'selected':''} ${state.answer[i]>=0?'assigned':''}`,`${cardName(c)}${state.answer[i]>=0?', di rumah '+(state.answer[i]+1):''}`)).join('')}</div><div class="bins" style="--bins:${m.bins.length}">${m.bins.map((b,i)=>btn('bin',i,`<span class="bin-icon">${i===0?'🏡':i===1?'🏠':i===2?'🏘️':'🏫'}</span><b>${escapeHTML(b)}</b><small>${state.answer.filter(v=>v===i).length} kartu</small>`,`bin`, `Rumah ${i+1}: ${b}`)).join('')}</div>`;break;
case'pattern':g.innerHTML=`<div class="game-meta"><span>🚂 Isi gerbong bertanda tanya</span><span>${m.level===4?'Amati pola gambar dan warna':'Cari bagian yang berulang'}</span></div><div class="pattern-train">${m.sequence.map((c,k)=>{const i=m.blanks.indexOf(k);return i<0?`<div class="train-car">${card(c,{small:true})}<small>${k+1}</small></div>`:btn('select',i,`${state.answer[i]?card(state.answer[i],{small:true}):'<span class="blank-icon">?</span>'}<small>${k+1}</small>`,`train-car missing ${state.selection===i?'selected':''}`,`Gerbong kosong ${k+1}`);}).join('')}</div><p class="mini-help">Seret gambar ke gerbong bertanda ?. Bisa juga ketuk gerbong, lalu gambarnya.</p><div class="choice-row">${m.choices.map((c,i)=>btn('pattern',i,card(c),`choice`,cardName(c))).join('')}</div>`;break;
case'mosaic':{const uri=pictureURI();g.innerHTML=`<div class="puzzle-layout"><div><div class="game-meta"><span>🧩 ${m.n} × ${m.n} potongan</span><span>Seret untuk bertukar tempat</span></div><div class="mosaic-board" style="--n:${m.n}">${state.answer.map((v,i)=>btn('tile',i,`<span style="background-image:url('${uri}');background-size:${m.n*100}% ${m.n*100}%;background-position:${(v%m.n)/(m.n-1)*100}% ${Math.floor(v/m.n)/(m.n-1)*100}%"></span>`,`puzzle-tile ${state.selection===i?'selected':''}`,`Potongan di baris ${Math.floor(i/m.n)+1}, kolom ${i%m.n+1}`)).join('')}</div></div><div class="puzzle-example"><b>Gambar tujuan</b><img src="${uri}" alt="Gambar utuh untuk dicontoh: ${theme().objects[m.animal].name}"><p>Perhatikan warna langit, garis, dan bentuk gambarnya.</p></div></div>`;break;}
case'matrix':g.innerHTML=`<div class="matrix-layout"><div class="matrix-board" style="--n:${m.n}">${state.answer.map((v,i)=>{const fixed=m.clues[i]>=0;return `<button class="matrix-cell ${fixed?'fixed':''} ${state.selection===i?'selected':''}" data-action="${fixed?'fixed':'select'}" data-value="${i}" aria-label="Baris ${Math.floor(i/m.n)+1}, kolom ${i%m.n+1}: ${v<0?'kosong':theme().objects[v].name}${fixed?', petunjuk tetap':''}">${v<0?'?':theme().objects[v].icon}${fixed?'<small>🔒</small>':''}</button>`;}).join('')}</div><div><h3>Siapa yang belum ada?</h3><p>↔ Ke samping: jangan ada gambar kembar.<br>↕ Ke bawah: jangan ada gambar kembar juga.</p><div class="choice-row">${E.range(m.n).map(i=>btn('matrix',i,theme().objects[i].icon,'symbol-button',theme().objects[i].name)).join('')}</div>${btn('matrix',-1,'⌫ Kosongkan','secondary')}</div></div>`;break;
case'factory':g.innerHTML=`<div class="factory-flow">${m.inputs.map((c,i)=>`<div class="factory-row"><div><small>AWAL ${i+1}</small>${card(c)}</div><span class="flow-arrow">→</span><div class="machine-output"><small>HASILMU</small>${card(state.outputs[i])}</div><span class="flow-arrow">→</span><div><small>TUJUAN</small>${card(m.targets[i])}</div></div>`).join('')}</div><div class="machine-key"><span>Warna berputar: ${E.colors.map(c=>`<span style="color:${c.hex}">${c.mark}</span> ${c.name}`).join(' → ')} → merah</span>${m.allowed.includes('object')?`<span>Gambar berputar: ${theme().objects.map(o=>o.icon).join(' → ')} → ${theme().objects[0].icon}</span>`:''}${m.allowed.includes('size')?'<span>Besar ↔ kecil mengubah ukuran gambar. Bingkai tetap sama.</span>':''}</div>${programEditor(m.allowed)}`;break;
case'route':g.innerHTML=`<div class="route-layout"><div><div class="route-board" style="--n:${m.n}">${E.range(m.n*m.n).map(i=>{const p=[i%m.n,Math.floor(i/m.n)],k=p.join(','),here=p.join(',')===state.pos.join(','),wall=m.walls.includes(k),star=m.stars.some(s=>s.join(',')===k)&&!state.stars.includes(k);return `<div class="route-cell ${wall?'wall':''} ${here?'here':''}" aria-label="Baris ${p[1]+1}, kolom ${p[0]+1}: ${here?'Bimo':wall?'rintangan':star?'bintang':k===m.goal.join(',')?'bendera':'jalan'}">${here?'🤖':wall?theme().icon:star?'⭐':k===m.goal.join(',')?'🚩':''}</div>`;}).join('')}</div><p class="mini-help">🤖 Bimo · 🚩 tujuan${m.stars.length?' · ⭐ '+state.stars.length+'/'+m.stars.length:''}</p></div><div>${programEditor(['L','U','D','R',...(m.stars.length?['C']:[])])}</div></div>`;break;
case'music':g.innerHTML=`<div class="music-score"><div class="game-meta"><b>🎼 Irama tujuan</b>${btn('listenMusic','', '▶ Dengarkan','secondary')}</div><div class="notes">${m.target.map((v,i)=>`<span class="note ${state.playing===i?'playing':''}">${noteIcon(v)}</span>`).join('')}</div><div class="your-notes"><small>Hasil rencanamu</small><div class="notes">${state.heard.length?state.heard.map(v=>`<span class="note">${noteIcon(v)}</span>`).join(''):'<span class="empty">Akan muncul saat kamu menjalankan rencana.</span>'}</div></div></div>${programEditor(['0','1','2','3'])}`;break;
case'detective':g.innerHTML=`<div class="detective-layout"><div class="clue-panel"><h3>🔎 Semua petunjuk harus cocok</h3><ol>${m.rules.map(r=>`<li>${ruleText(r)}</li>`).join('')}</ol>${btn('clues','','🔊 Bacakan petunjuk','secondary')}<p class="mini-help">Gambar kecil / besar dan tanda ★ juga bisa menjadi petunjuk.</p></div><div class="suspects">${m.cards.map((c,i)=>btn('suspect',i,card(c),`suspect ${state.answer===i?'selected':''}`,`Pilihan ${i+1}: ${cardName(c)}`)).join('')}</div></div>`;break;
case'packing':g.innerHTML=`<div class="bags">${m.targets.map((target,b)=>{const sum=m.cards.reduce((s,c,i)=>s+(state.answer[i]===b?c.value:0),0);return btn('bag',b,`<span class="bag-icon">🎒</span><div><b>Tas ${b+1}: ${sum} / ${target}</b><span class="target-dots" aria-label="Tujuan ${target} titik">${'●'.repeat(target)}</span>${m.counts?`<small>${state.answer.filter(v=>v===b).length} / ${m.counts[b]} bekal</small>`:''}</div>`,`bag ${sum===target?'balanced':''}`,`Masukkan ke tas ${b+1}, jumlah ${sum}, tujuan ${target}`);}).join('')}</div><p class="mini-help">Seret bekal ke tas. Ketuk bekal yang sudah masuk untuk mengeluarkannya.</p><div class="provisions">${m.cards.map((c,i)=>btn('provision',i,`<span>${theme().objects[c.o].icon}</span><strong>${'●'.repeat(c.value)}</strong><small>${state.answer[i]<0?c.value+' titik':'Di tas '+(state.answer[i]+1)}</small>`,`provision ${state.selection===i?'selected':''} ${state.answer[i]>=0?'assigned':''}`,`Bekal ${i+1}, ${c.value} titik${state.answer[i]>=0?', di tas '+(state.answer[i]+1):''}`)).join('')}</div>`;break;
}preparePlay();decoratePlay();$('#check').disabled=state.busy||m.type==='memory';if(m.type==='memory')$('#check').textContent='🐾 Temukan semua pasangan';}
function pictureURI(){const w=theme(),c=E.colors[m.color].hex,accent=E.colors[(m.color+2)%4].hex;const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400"><rect width="400" height="400" fill="${w.tint}"/><path d="M0 270 Q100 190 210 285 T400 230 V400 H0Z" fill="${c}"/><path d="M0 330 Q150 255 400 310 V400 H0Z" fill="${accent}"/><circle cx="335" cy="62" r="30" fill="#fff5cc"/><path d="M20 25 H100 V105 H20Z" fill="${accent}" opacity=".55"/><path d="M40 45 H80 V85 H40Z" fill="#fff" opacity=".6"/><circle cx="65" cy="190" r="25" fill="${c}"/><path d="M298 190 l35 -55 35 55Z" fill="${accent}"/><path d="M30 365 Q180 330 370 365" fill="none" stroke="#fff9e9" stroke-width="12" stroke-dasharray="16 9"/><text x="200" y="265" text-anchor="middle" font-family="Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif" font-size="165">${w.objects[m.animal].icon}</text><text x="325" y="310" font-family="Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif" font-size="45">${w.objects[(m.animal+1+m.decor)%4].icon}</text><circle cx="70" cy="310" r="12" fill="#fff9e9"/><circle cx="90" cy="290" r="7" fill="#fff9e9"/></svg>`;return 'data:image/svg+xml,'+encodeURIComponent(svg).replaceAll("'",'%27');}
const noteIcon=v=>['👏','🥁','🔔','🎹'][+v];
function commandName(t){return ({R:'Kanan',L:'Kiri',U:'Atas',D:'Bawah',C:'Jika ⭐, ambil',color:'Warna berikut',object:'Gambar berikut',size:'Besar ↔ kecil',if:'Jika merah → kuning','0':'Tepuk','1':'Drum','2':'Lonceng','3':'Piano'})[t]||t;}
function commandIcon(t){return({R:'→',L:'←',U:'↑',D:'↓',C:'⭐ ?',color:'🎨 ↻',object:'🐾 ↻',size:'↕',if:'● → ▲','0':'👏','1':'🥁','2':'🔔','3':'🎹'})[t]||t;}
function codeLabel(c){return c.type==='repeat'?`↻ ${c.count}× [ ${c.body.map(codeLabel).join(' ')} ]`:c.type==='function'?`🚀 Jurus [ ${c.body.map(codeLabel).join(' ')} ]`:commandIcon(c.type);}
function programEditor(allowed){const loop=(m.type==='music'&&m.level>=1)||(m.type==='factory'&&m.level>=2)||m.type==='route'&&m.level>=3,fn=m.type==='music'&&m.level>=3;return `<section class="code-editor"><h3>🧱 Susun rencanamu</h3><p class="mini-help">Seret kartu ke kotak. Bimo membaca dari kiri ke kanan →. Mau ganti urutan? Geser kartunya. Ketuk × untuk menghapus.</p><div class="palette">${allowed.map(t=>btn('add',t,`<b>${commandIcon(t)}</b><small>${commandName(t)}</small>`,'command','Tambah '+commandName(t))).join('')}</div><div class="program" aria-label="Rencana instruksi">${state.program.length?state.program.map((c,i)=>btn('remove',i,`${codeLabel(c)} <small>×</small>`,`token ${c.body?'group':''} ${state.active===i?'playing':''}`,'Hapus kartu '+(i+1)+': '+codeLabel(c))).join(''):'<span class="empty">✋ Seret kartu ke sini. Susun dari kiri ke kanan →</span>'}</div><div class="editor-tools">${btn('undo','','↶ Hapus terakhir','secondary')}${btn('clearProgram','','Kosongkan rencana','secondary')}${loop?btn('repeat',2,'↻ Ulang 2×','secondary purple')+btn('repeat',3,'↻ Ulang 3×','secondary purple'):''}${fn?btn('saveFn','','🪄 Simpan jadi Jurus','secondary purple')+btn('callFn','','🚀 Pakai Jurus','secondary purple'):''}</div>${loop?'<p class="mini-help">↻ Ulang 2× artinya: lakukan semua kartu di kotak dua kali.</p>':''}${fn?`<div class="function-box">Jurus Irama: ${state.fn.length?state.fn.map(codeLabel).join(' '):'susun irama, lalu simpan di sini.'}</div>`:''}</section>`;}
function ruleText(r){const value=v=>r.field==='o'?theme().objects[v].icon+' '+theme().objects[v].name:r.field==='c'?E.colors[v].mark+' '+E.colors[v].name:r.field==='big'?(v?'besar':'kecil'):(v?'memakai bintang ★':'tanpa bintang');return r.op==='in'?`Pilih ${r.value.map(value).join(' ATAU ')}.`:r.op==='ne'?`BUKAN ${value(r.value)}.`:r.field==='big'?`Gambarnya ${value(r.value)}.`:r.field==='badge'?`${value(r.value)}.`:`${r.field==='c'?'Bingkainya':'Gambarnya'} ${value(r.value)}.`;}
async function memory(i){if(state.busy||state.matched[i]||state.flipped.includes(i))return;state.flipped.push(i);renderGame();if(state.flipped.length<2)return;state.tries++;const[a,b]=state.flipped;if(m.cards[a].pair===m.cards[b].pair){state.matched[a]=state.matched[b]=true;state.flipped=[];renderGame();if(E.validate(m,state.matched))win();else{setStatus('Ketemu kembarnya! Gambar dan warnanya sama. Tos! 🖐️','good');animatePlay('.memory-tile.matched');}}else{state.busy=true;setStatus(m.cards[a].o===m.cards[b].o?'Gambarnya kembar! Coba lihat warna bingkainya. Sudah sama?':'Gambarnya belum kembar. Ingat satu gambar dulu. Tadi ada di mana, ya?','thinking');reactBimo('think');renderGame();const token=epoch;await new Promise(r=>setTimeout(r,1100));if(token!==epoch)return;state.flipped=[];state.busy=false;renderGame();}}
function hint(){showThinking();}
function wrongMessage(){return diagnoseAttempt().text;}
async function check(){if(state.busy)return;if(['route','factory','music'].includes(m.type))return runProgram();if(m.type==='memory')return;try{if(E.validate(m,state.answer))win();else showThinking(true);}catch{setStatus('Mari susun dulu jawabannya.');}}
async function runProgram(){if(!state.program.length)return setStatus('Tambahkan kartu ke rencanamu dulu.');let steps;try{steps=E.flatten(state.program);}catch{return setStatus('Rencananya terlalu panjang. Coba sederhanakan, lalu jalankan lagi.');}state.busy=true;state.active=-1;const token=epoch;let travel=null;if(m.type==='route'){travel=E.travel(m,state.program);state.pos=[...m.start];state.stars=[];}if(m.type==='factory')state.outputs=clone(m.inputs);if(m.type==='music')state.heard=[];let offsets=[],counter=0;state.program.forEach((c,i)=>{const n=E.flatten([c]).length;for(let j=0;j<n;j++)offsets[counter++]=i;});renderGame();for(let i=0;i<steps.length;i++){if(token!==epoch)return;state.active=offsets[i];if(m.type==='route'){if(i>=travel.history.length-1){state.busy=false;renderGame();return showThinking(true);}state.pos=[...travel.history[i+1].pos];state.stars=[...travel.history[i+1].stars];}else if(m.type==='factory')state.outputs=state.outputs.map(c=>E.transform(c,steps[i]));else{state.playing=i;state.heard.push(steps[i]);playNote(steps[i]);}renderGame();await new Promise(r=>setTimeout(r,500));}if(token!==epoch)return;state.busy=false;state.active=-1;if(m.type==='music')state.playing=-1;renderGame();const req=m.require||[];if(!req.every(t=>E.has(state.program,t)))return showThinking(true,'Untuk misi ini, gunakan '+req.map(t=>t==='repeat'?'kotak Ulang':t==='function'?'Jurus Irama':'mesin Jika merah').join(' dan ')+'.');if(E.validate(m,state.program))win();else showThinking(true);}
function playNote(v){if(!sound)return;try{audioCtx??=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=[330,220,660,440][+v]||330;g.gain.setValueAtTime(.08,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.25);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.3);}catch{}}
async function listenMusic(){if(state.busy)return;sound=true;updateSound();state.busy=true;const token=epoch;for(let i=0;i<m.target.length;i++){if(token!==epoch)return;state.playing=i;playNote(m.target[i]);renderGame();await new Promise(r=>setTimeout(r,420));}if(token!==epoch)return;state.playing=-1;state.busy=false;renderGame();setStatus('Sekarang giliranmu menyusun irama yang sama.');}
function win(){if(!progress.done.includes(m.id))progress.done.push(m.id);save();setStatus('Berhasil! Kamu mencoba, berpikir, dan menemukan caranya. 🌟','good');const id=m.id,chapterStart=Math.floor(id/10)*10,chapterDone=E.range(10).every(i=>progress.done.includes(chapterStart+i));showDialog(`<div class="celebrate"><div class="party-sprinkles" aria-hidden="true"><span>🌼</span><span>✨</span><span>🌈</span><span>⭐</span><span>🎈</span></div><div class="celebration-icon">${chapterDone?'🏅':'🌟'}</div><span class="eyebrow">MISI ${id+1} SELESAI</span><h2>${chapterDone?'Satu dunia, banyak penemuan!':'Aku menemukan caranya!'}</h2><p>${typeInfo().reflect}</p><div class="reward">${theme().icon} ${theme().name} · ${progress.done.length} / 1.000 misi</div><p class="mini-help">${storageOK?'Progres tersimpan.':'Progres belum tersimpan; unduh lewat menu orang tua.'} Istirahat dulu juga boleh.</p><div class="finish-actions"><button class="secondary" data-action="closeHome">Kembali ke peta</button>${id<999?`<button class="primary" data-action="next" data-value="${id+1}">Permainan berikutnya →</button>`:''}</div></div>`);}
function showDialog(html){dialog.innerHTML='<button class="close" data-action="close" aria-label="Tutup dialog">×</button>'+html;if(!dialog.open)dialog.showModal();}
function download(name,text,type){const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function parents(){stop();if(m)renderGame();showDialog(`<span class="eyebrow">PETUALANGAN DENGAN PENDAMPING</span><h2>Banyak misi, tanpa buru-buru.</h2><p><b>1.000 misi = 10 jenis permainan × 20 tema × 5 tingkat.</b> Isi dibangkitkan secara deterministik: misi yang sama tetap sama setiap dibuka. Variasinya mencakup pilihan, pola, petunjuk, aturan, dan susunan; bukan 1.000 kurikulum yang sepenuhnya berbeda.</p><p>Untuk anak usia 6 tahun, mulai dari tingkat 1. Tingkat 4–5 merupakan tantangan lanjutan dengan pendamping, bukan target yang harus segera dikuasai. Satu misi bisa menjadi satu pertemuan singkat, diulang, atau dikembangkan tanpa layar.</p><div class="parent-rhythm"><span>👐 5 menit<br><b>Gerak & benda nyata</b></span><span>🧩 10 menit<br><b>Main & mencoba</b></span><span>💬 5 menit<br><b>Cerita caranya</b></span></div><p>Sesuaikan durasi dengan anak. Rayakan caranya mencoba dan menjelaskan. Jika masih bingung, mainkan contoh dengan benda nyata sebelum kembali ke layar.</p><h3>Jenjang tantangan</h3><div class="curriculum">${E.levels.map((l,i)=>`<details><summary>${l.icon} Tingkat ${i+1}: ${l.name} · misi ${i*200+1}–${(i+1)*200}</summary><p>${l.description}</p><p>${['Pasangan 3 pasang, pengelompokan warna, pola AB, puzzle 2×2, dan logika 3×3 dengan sedikit kotak kosong.','Pasangan 4 pasang, pengelompokan gambar, pola ABC, lebih banyak kotak kosong, dan pengulangan irama.','Pasangan 5 pasang, gabungan gambar–warna, puzzle 3×3, logika 4×4, serta mesin pengulangan.','Pasangan 6 pasang, aturan DAN, petunjuk negatif, kondisi mesin, fungsi irama, dan dua tas bekal.','Pasangan 8 pasang, aturan ATAU + DAN, pola gabungan, puzzle 4×4, kondisi dalam pengulangan, dan batas jumlah bekal.'][i]}</p></details>`).join('')}</div><h3>10 cara melatih logika</h3><div class="curriculum">${E.types.map(t=>`<details><summary>${t.icon} ${t.name} · ${t.skill}</summary><p>${t.goal}</p><p>Tanpa layar: ${t.off}</p><p>Refleksi: ${t.reflect}</p></details>`).join('')}</div><p><b>Progres:</b> ${progress.done.length}/1.000. Hanya tersimpan di browser ini. Ekspor cadangan dan impor untuk menggabungkan progres di perangkat lain. Versi baru memakai progres terpisah dari 40 misi versi awal.</p><div class="parent-actions"><button class="secondary" data-action="export">↓ Cadangkan progres</button><label class="secondary file-label">↑ Impor progres<input id="importFile" type="file" accept="application/json,.json"></label><button class="secondary" data-action="print">Cetak panduan</button><button class="secondary" data-action="guideDownload">↓ Panduan 1.000 misi</button></div><p id="importStatus" role="status" class="mini-help"></p><p class="mini-help">Suara memerlukan dukungan browser. Game tetap dapat digunakan tanpa suara atau internet. Tanda ● ■ ▲ ◆ membantu membedakan warna.</p><a class="text-link" href="classic/index.html">Buka 40 misi arah versi awal →</a>`);$('#importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>100000)throw Error('Berkas terlalu besar');const raw=JSON.parse(await f.text());if(raw.version!==3)throw Error('Pilih berkas cadangan Kode Kecil versi 3');const p=cleanProgress(raw);progress.done=[...new Set([...progress.done,...p.done])];save();$('#importStatus').textContent=`${progress.done.length} misi selesai setelah progres digabung. ${storageOK?'Tersimpan.':'Penyimpanan browser tidak tersedia.'}`;}catch(err){$('#importStatus').textContent='Belum bisa diimpor: '+err.message;}};}
function guideDownload(){const lines=['# Kode Kecil — Panduan 1.000 Misi','','10 jenis permainan × 20 tema × 5 tingkat. Misi yang sama konsisten setiap dibuka. Bukan 1.000 kurikulum unik.','','Untuk usia 6 tahun, mulai dari tingkat 1 dengan pendamping. Tingkat lanjut menambah tantangan, bukan kewajiban usia. Usulan sesi: 5 menit tanpa layar, 10 menit bermain, 5 menit cerita. Boleh lebih singkat, diulang, atau dijeda.','','## Jenis permainan',...E.types.flatMap(t=>['',`### ${t.name}`,t.goal,`Tanpa layar: ${t.off}`,`Refleksi: ${t.reflect}`]),'','## Daftar pertemuan'];for(let id=0;id<1000;id++){const x=E.make(id);lines.push(`${id+1}. Tingkat ${x.level+1} — ${E.themes[x.theme].name} — ${x.title}: ${x.skill}. ${E.describe(x)}`);}download('panduan-1000-misi-kode-kecil.md',lines.join('\n'),'text/markdown');}
function updateSound(){$('#soundBtn').textContent=sound?'♫':'♪';$('#soundBtn').setAttribute('aria-pressed',String(sound));$('#soundBtn').setAttribute('aria-label',sound?'Matikan suara':'Aktifkan suara');}
async function action(a,v){if(a==='close'){dialog.close();return;}if(a==='closeHome'){dialog.close();home();return;}if(a==='next'){dialog.close();openMission(+v);return;}if(a==='home')return home();if(a==='chapter')return chapter(+v);if(a==='open')return openMission(+v);if(a==='resume')return openMission(next());if(a==='filter'){filter=filter===v?null:v;home();$('#app .map-section').scrollIntoView({behavior:'smooth'});return;}if(a==='alltypes'){filter=null;home();return;}if(a==='level'){level=+v;home();$('.map-section').scrollIntoView();return;}if(a==='export')return download('kode-kecil-progres.json',JSON.stringify({version:3,...progress},null,2),'application/json');if(a==='print'){dialog.querySelectorAll('details').forEach(d=>d.open=true);window.print();return;}if(a==='guideDownload')return guideDownload();if(!m||!state)return;if(a==='reset'){stop();state=initState();renderGame();setStatus(initialMessage());return;}if(a==='hint')return hint();if(a==='listen'||a==='clues'){if(!('speechSynthesis'in window))return setStatus('Browser ini belum menyediakan pembacaan suara. Pendamping bisa membacakan petunjuk.');speak(a==='clues'?m.rules.map(ruleText).join(' '):playGuides[m.type].join('. ')+'. '+missionBrief(),true);return;}if(state.busy)return;if(playfulAction(a,v))return;if(a==='check')return check();if(a==='listenMusic')return listenMusic();if(a==='memory')return memory(+v);
if(a==='select'){state.selection=+v;}else if(a==='bin'){if(state.selection===null)return setStatus('Pilih satu kartu dulu, lalu rumahnya.');state.answer[state.selection]=+v;state.selection=null;setStatus('Kartu masuk rumah. Boleh dipindahkan lagi kalau berubah pikiran.');}else if(a==='pattern'){if(state.selection===null)return setStatus('Pilih gerbong yang kosong dulu.');state.answer[state.selection]=clone(m.choices[+v]);const empty=state.answer.findIndex(c=>!c);if(empty>=0)state.selection=empty;}else if(a==='tile'){if(state.selection===null)state.selection=+v;else{const i=state.selection;[state.answer[i],state.answer[+v]]=[state.answer[+v],state.answer[i]];state.selection=null;}}else if(a==='matrix'){if(state.selection===null||m.clues[state.selection]>=0)return setStatus('Pilih kotak tanpa gembok dulu.');state.answer[state.selection]=+v;}else if(a==='fixed')return setStatus('Kotak bergembok adalah petunjuk. Pilih kotak yang bisa kamu isi.');else if(a==='suspect'){state.answer=+v;state.crossed=(state.crossed||[]).filter(i=>i!==+v);}else if(a==='provision'){if(state.answer[+v]>=0){state.answer[+v]=-1;state.selection=null;}else state.selection=+v;}else if(a==='bag'){if(state.selection===null)return setStatus('Pilih satu bekal dulu, lalu pilih tas.');state.answer[state.selection]=+v;state.selection=null;}else if(a==='add'){if(state.program.length>=30)return setStatus('Rencananya sudah panjang. Hapus kartu atau gunakan Ulang.');state.program.push({type:v});state.active=-1;}else if(a==='remove'){state.program.splice(+v,1);state.active=-1;}else if(a==='undo')state.program.pop();else if(a==='clearProgram'){state.program=[];state.active=-1;}else if(a==='repeat'){if(!state.program.length)return setStatus('Susun pola pendek dulu, baru ketuk Ulang.');if(E.has(state.program,'repeat'))return setStatus('Untuk misi ini cukup satu lapis Ulang. Susun ulang jika ingin mengganti jumlahnya.');state.program=[{type:'repeat',count:+v,body:clone(state.program)}];}else if(a==='saveFn'){if(!state.program.length)return setStatus('Susun irama dulu, lalu simpan sebagai Jurus.');if(E.has(state.program,'function'))return setStatus('Buat jurus dari bunyi dan pengulangan, tanpa memanggil dirinya sendiri.');state.fn=clone(state.program);state.program=[];}else if(a==='callFn'){if(!state.fn.length)return setStatus('Simpan rangkaian bunyi menjadi Jurus dulu.');if(state.program.length>=30)return setStatus('Hapus beberapa kartu dulu.');state.program.push({type:'function',body:clone(state.fn)});}state.dotCount=0;renderGame();const motionTargets={bin:'.bin',bag:'.bag',pattern:'.train-car.selected',tile:'.mosaic-board',matrix:'.matrix-board',suspect:'.suspect.selected',add:'.token:last-child',callFn:'.token:last-child',repeat:'.token',saveFn:'.function-box'};if(motionTargets[a]||['remove','undo','clearProgram','provision'].includes(a))setStatus('Sudah diubah! Menurutmu, sekarang sudah cocok? 🌱');if(motionTargets[a])animatePlay(motionTargets[a]);}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b&&!b.disabled)action(b.dataset.action,b.dataset.value);});$('#brand').onclick=e=>{e.preventDefault();home();};$('#mapBtn').onclick=home;$('#parentsBtn').onclick=parents;$('#soundBtn').onclick=()=>{sound=!sound;updateSound();if(sound)speak('Halo, penjelajah kecil! Ayo menemukan hal baru.');else if('speechSynthesis'in window)speechSynthesis.cancel();};home();
