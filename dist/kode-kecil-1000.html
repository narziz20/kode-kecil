function programEditor(allowed){const loop=(m.type==='music'&&m.level>=1)||(m.type==='factory'&&m.level>=2)||m.type==='route'&&m.level>=3,fn=m.type==='music'&&m.level>=3;return `<section class="code-editor"><h3>🧱 Kodeku</h3><p class="mini-help">Seret kartu ke kotak. Bimo membaca dari kiri ke kanan →. Mau ganti urutan? Geser kartunya. Ketuk × untuk menghapus.</p><div class="palette">${allowed.map(t=>btn('add',t,`<b>${commandIcon(t)}</b><small>${commandName(t)}</small>`,'command','Tambah '+commandName(t))).join('')}</div><div class="program" aria-label="Rencana instruksi">${state.program.length?state.program.map((c,i)=>btn('remove',i,`${codeLabel(c)} <small>×</small>`,`token ${c.body?'group':''} ${state.active===i?'playing':''}`,'Hapus kartu '+(i+1)+': '+codeLabel(c))).join(''):'<span class="empty">✋ Taruh di sini →</span>'}</div><div class="editor-tools">${btn('undo','','↶ Hapus','secondary')}${btn('clearProgram','','↺ Bersihkan','secondary')}${loop?btn('repeat',2,'↻ Ulang 2×','secondary purple')+btn('repeat',3,'↻ Ulang 3×','secondary purple'):''}${fn?btn('saveFn','','🪄 Simpan jurus','secondary purple')+btn('callFn','','🚀 Pakai Jurus','secondary purple'):''}</div>${loop?'<p class="mini-help">↻ Ulang 2× artinya: lakukan semua kartu di kotak dua kali.</p>':''}${fn?`<div class="function-box">Jurus Irama: ${state.fn.length?state.fn.map(codeLabel).join(' '):'belum dibuat'}</div>`:''}</section>`;}
function ruleText(r){const value=v=>r.field==='o'?theme().objects[v].icon+' '+theme().objects[v].name:r.field==='c'?E.colors[v].mark+' '+E.colors[v].name:r.field==='big'?(v?'besar':'kecil'):(v?'memakai bintang ★':'tanpa bintang');return r.op==='in'?`Pilih ${r.value.map(value).join(' ATAU ')}.`:r.op==='ne'?`BUKAN ${value(r.value)}.`:r.field==='big'?`Gambarnya ${value(r.value)}.`:r.field==='badge'?`${value(r.value)}.`:`${r.field==='c'?'Bingkainya':'Gambarnya'} ${value(r.value)}.`;}
async function memory(i){if(state.busy||state.matched[i]||state.flipped.includes(i))return;state.flipped.push(i);renderGame();if(state.flipped.length<2)return;state.tries++;const[a,b]=state.flipped;if(m.cards[a].pair===m.cards[b].pair){state.matched[a]=state.matched[b]=true;state.flipped=[];renderGame();if(E.validate(m,state.matched))win();else{setStatus('Ketemu kembarnya! Gambar dan warnanya sama. Tos! 🖐️','good');animatePlay('.memory-tile.matched');}}else{state.busy=true;const mismatch=m.cards[a].o===m.cards[b].o?'Gambarnya kembar! Coba lihat warna bingkainya. Sudah sama?':'Gambarnya belum kembar. Ingat satu gambar dulu. Tadi ada di mana, ya?';setStatus(mismatch,'thinking',false);reactBimo('think');renderGame();const token=epoch;await new Promise(r=>setTimeout(r,1100));if(token!==epoch)return;state.flipped=[];state.busy=false;renderGame();showThinking(true,mismatch);}}
function hint(){showThinking(false,m.id>=1000?lessonClue():'');}
function wrongMessage(){return diagnoseAttempt().text;}
async function check(){if(state.busy)return;if(m.type==='cause'){const q=state.question||0;if(!m.questions[q].choices[state.answer[q]]?.correct)return showThinking(true,lessonClue());if(E.validate(m,state.answer))return win();state.question=q+1;renderGame();setStatus('Bagus! Coba yang berikutnya.','good');return;}if(['route','factory','music'].includes(m.type))return runProgram();if(m.type==='memory')return;try{if(E.validate(m,state.answer))win();else showThinking(true,m.id>=1000?lessonClue():'');}catch{showThinking(true,'Mari susun dulu jawabannya.');}}
async function runProgram(){if(!state.program.length)return showThinking(true,'Rencananya masih kosong. Tambahkan satu kartu dulu, yuk!');let steps;try{steps=E.flatten(state.program);}catch{return showThinking(true,'Rencananya panjang sekali. Coba kurangi kartunya, lalu jalankan lagi.');}state.busy=true;state.active=-1;const token=epoch;let travel=null;if(m.type==='route'){travel=E.travel(m,state.program);state.pos=[...m.start];state.stars=[];}if(m.type==='factory')state.outputs=clone(m.inputs);if(m.type==='music')state.heard=[];let offsets=[],counter=0;state.program.forEach((c,i)=>{const n=E.flatten([c]).length;for(let j=0;j<n;j++)offsets[counter++]=i;});renderGame();for(let i=0;i<steps.length;i++){if(token!==epoch)return;state.active=offsets[i];if(m.type==='route'){if(i>=travel.history.length-1){state.busy=false;renderGame();return showThinking(true);}state.pos=[...travel.history[i+1].pos];state.stars=[...travel.history[i+1].stars];}else if(m.type==='factory')state.outputs=state.outputs.map(c=>E.transform(c,steps[i]));else{state.playing=i;state.heard.push(steps[i]);playNote(steps[i]);}renderGame();await new Promise(r=>setTimeout(r,500));}if(token!==epoch)return;state.busy=false;state.active=-1;if(m.type==='music')state.playing=-1;renderGame();const req=m.require||[];if(!req.every(t=>E.has(state.program,t)))return showThinking(true,'Untuk misi ini, gunakan '+req.map(t=>t==='repeat'?'kotak Ulang':t==='function'?'Jurus Irama':'mesin Jika merah').join(' dan ')+'.');if(E.validate(m,state.program))win();else showThinking(true,m.id>=1000?lessonClue():'');}
function playNote(v){if(!sound)return;try{audioCtx??=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=[330,220,660,440][+v]||330;g.gain.setValueAtTime(.08,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.25);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.3);}catch{}}
async function listenMusic(){if(state.busy)return;sound=true;updateSound();state.busy=true;const token=epoch;for(let i=0;i<m.target.length;i++){if(token!==epoch)return;state.playing=i;playNote(m.target[i]);renderGame();await new Promise(r=>setTimeout(r,420));}if(token!==epoch)return;state.playing=-1;state.busy=false;renderGame();setStatus('Sekarang giliranmu menyusun irama yang sama.');}
function win(){const fresh=!progress.done.includes(m.id);if(fresh)progress.done.push(m.id);save();setStatus('Berhasil! Kamu menemukan caranya. 🌟','good');const ids=pathIds(m.type),index=ids.indexOf(m.id),nextId=ids[index+1],done=ids.filter(id=>progress.done.includes(id)).length;showDialog(`<div class="celebrate"><div class="party-sprinkles" aria-hidden="true"><span>🌼</span><span>✨</span><span>🌈</span><span>⭐</span><span>🎈</span></div><div class="celebration-icon">🌟</div><span class="eyebrow">LEVEL ${index+1} SELESAI</span><h2>${fresh?'Hore, dapat bintang!':'Hebat, berhasil lagi!'}</h2><div class="reward">${typeInfo().icon} ${typeInfo().name} · ⭐ ${done} / ${ids.length}</div><div class="finish-actions"><button class="secondary" data-action="closePath" data-value="${m.type}">Lihat levelku</button>${nextId!==undefined&&unlocked(nextId)?`<button class="primary" data-action="next" data-value="${nextId}">Level berikutnya →</button>`:''}</div></div>`);}
function showDialog(html){dialog.dataset.feedback='false';dialog.removeAttribute('aria-labelledby');dialog.innerHTML='<button class="close" data-action="close" aria-label="Tutup dialog">×</button>'+html;if(!dialog.open)dialog.showModal();}
function download(name,text,type){const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function parents(){stop();if(m)renderGame();showDialog(`<span class="eyebrow">PETUALANGAN DENGAN PENDAMPING</span><h2>Banyak misi, tanpa buru-buru.</h2><p><b>1.045 misi: 10 permainan awal × 20 tema × 5 tingkat, ditambah 45 misi Sebab Akibat, Urutan Cerita, dan Detektif Kode.</b> Isi dibangkitkan secara deterministik: misi yang sama tetap sama setiap dibuka. Variasinya mencakup pilihan, pola, petunjuk, aturan, dan susunan; bukan 1.000 kurikulum yang sepenuhnya berbeda.</p><p>Untuk anak usia 6 tahun, mulai dari tingkat 1. Tingkat 4–5 merupakan tantangan lanjutan dengan pendamping, bukan target yang harus segera dikuasai. Satu misi bisa menjadi satu pertemuan singkat, diulang, atau dikembangkan tanpa layar.</p><div class="parent-rhythm"><span>👐 5 menit<br><b>Gerak & benda nyata</b></span><span>🧩 10 menit<br><b>Main & mencoba</b></span><span>💬 5 menit<br><b>Cerita caranya</b></span></div><p>Sesuaikan durasi dengan anak. Rayakan caranya mencoba dan menjelaskan. Jika masih bingung, mainkan contoh dengan benda nyata sebelum kembali ke layar.</p>${voiceSettings()}<h3>Jenjang tantangan</h3><div class="curriculum">${E.levels.map((l,i)=>`<details><summary>${l.icon} Tingkat ${i+1}: ${l.name} · misi ${i*200+1}–${(i+1)*200}</summary><p>${l.description}</p><p>${['Pasangan 3 pasang, pengelompokan warna, pola AB, puzzle 2×2, dan logika 3×3 dengan sedikit kotak kosong.','Pasangan 4 pasang, pengelompokan gambar, pola ABC, lebih banyak kotak kosong, dan pengulangan irama.','Pasangan 5 pasang, gabungan gambar–warna, puzzle 3×3, logika 4×4, serta mesin pengulangan.','Pasangan 6 pasang, aturan DAN, petunjuk negatif, kondisi mesin, fungsi irama, dan dua tas bekal.','Pasangan 8 pasang, aturan ATAU + DAN, pola gabungan, puzzle 4×4, kondisi dalam pengulangan, dan batas jumlah bekal.'][i]}</p></details>`).join('')}</div><h3>13 cara melatih logika</h3><div class="curriculum">${E.types.map(t=>`<details><summary>${t.icon} ${t.name} · ${t.skill}</summary><p>${t.goal}</p><p>Tanpa layar: ${t.off}</p><p>Refleksi: ${t.reflect}</p></details>`).join('')}</div><p><b>Progres:</b> ${progress.done.length}/1.045. Hanya tersimpan di browser ini. Ekspor cadangan dan impor untuk menggabungkan progres di perangkat lain. Versi baru memakai progres terpisah dari 40 misi versi awal.</p><div class="parent-actions"><button class="secondary" data-action="export">↓ Cadangkan progres</button><label class="secondary file-label">↑ Impor progres<input id="importFile" type="file" accept="application/json,.json"></label><button class="secondary" data-action="print">Cetak panduan</button><button class="secondary" data-action="guideDownload">↓ Panduan semua misi</button></div><p id="importStatus" role="status" class="mini-help"></p><p class="mini-help">Suara memerlukan dukungan browser. Game tetap dapat digunakan tanpa suara atau internet. Tanda ● ■ ▲ ◆ membantu membedakan warna.</p><a class="text-link" href="classic/index.html">Buka 40 misi arah versi awal →</a>`);bindVoiceSettings();$('#importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>100000)throw Error('Berkas terlalu besar');const raw=JSON.parse(await f.text());if(raw.version!==3)throw Error('Pilih berkas cadangan Kode Kecil versi 3');const p=cleanProgress(raw);progress.done=[...new Set([...progress.done,...p.done])];save();$('#importStatus').textContent=`${progress.done.length} misi selesai setelah progres digabung. ${storageOK?'Tersimpan.':'Penyimpanan browser tidak tersedia.'}`;}catch(err){$('#importStatus').textContent='Belum bisa diimpor: '+err.message;}};}
function guideDownload(){const lines=['# Kode Kecil — Panduan 1.045 Misi','','13 jenis permainan, 1.045 misi. Setiap permainan memiliki jalur level sendiri. Misi yang sama konsisten setiap dibuka.','','Untuk usia 6 tahun, mulai dari tingkat 1 dengan pendamping. Tingkat lanjut menambah tantangan, bukan kewajiban usia. Usulan sesi: 5 menit tanpa layar, 10 menit bermain, 5 menit cerita. Boleh lebih singkat, diulang, atau dijeda.','','## Jenis permainan',...E.types.flatMap(t=>['',`### ${t.name}`,t.goal,`Tanpa layar: ${t.off}`,`Refleksi: ${t.reflect}`]),'','## Daftar pertemuan'];for(let id=0;id<TOTAL_MISSIONS;id++){const x=E.make(id);lines.push(`${id+1}. Tingkat ${x.level+1} — ${E.themes[x.theme].name} — ${x.title}: ${x.skill}. ${E.describe(x)}`);}download('panduan-1000-misi-kode-kecil.md',lines.join('\n'),'text/markdown');}
function updateSound(){$('#soundBtn').textContent=sound?'♫':'♪';$('#soundBtn').setAttribute('aria-pressed',String(sound));$('#soundBtn').setAttribute('aria-label',sound?'Matikan suara':'Aktifkan suara');}
async function action(a,v){if(a==='voicePreview'){speak('Hai, aku Bimo! Yuk, kita main bersama. Hmm, menurutmu, kartu ini cocok di mana? Pelan-pelan saja. Kamu pasti bisa mencoba!',true);return;}if(a==='voiceStop'){BimoVoice.stop();return;}if(a==='close'){BimoVoice.stop();dialog.close();return;}if(a==='closeHome'){dialog.close();home();return;}if(a==='closePath'){dialog.close();return journey(v);}if(a==='journey')return journey(v);if(a==='next'){dialog.close();if(unlocked(+v))openMission(+v);return;}if(a==='home')return home();if(a==='chapter')return chapter(+v);if(a==='open'){if(unlocked(+v))return openMission(+v);return;}if(a==='resume')return openMission(next());if(a==='filter')return journey(v);if(a==='alltypes'){filter=null;home();return;}if(a==='level'){level=+v;home();$('.map-section').scrollIntoView();return;}if(a==='export')return download('kode-kecil-progres.json',JSON.stringify({version:3,...progress},null,2),'application/json');if(a==='print'){dialog.querySelectorAll('details').forEach(d=>d.open=true);window.print();return;}if(a==='guideDownload')return guideDownload();if(!m||!state)return;if(a==='reset'){stop();state=initState();renderGame();setStatus(initialMessage());return;}if(a==='hint')return hint();if(a==='listen'||a==='clues'){if(!('speechSynthesis'in window))return setStatus('Browser ini belum menyediakan pembacaan suara. Pendamping bisa membacakan petunjuk.');speak(a==='clues'?m.rules.map(ruleText).join(' '):'Yuk, kita coba! '+missionBrief()+' Pelan-pelan saja, ya.',true);return;}if(state.busy)return;if(playfulAction(a,v))return;if(a==='check')return check();if(a==='listenMusic')return listenMusic();if(a==='memory')return memory(+v);
const moveFrom=GameMotion.rect(document.querySelector(a==='bin'?`[data-action="select"][data-value="${state.selection}"]`:a==='bag'?`[data-action="provision"][data-value="${state.selection}"]`:a==='pattern'?`[data-action="pattern"][data-value="${v}"]`:a==='matrix'?`[data-action="matrix"][data-value="${v}"]`:a==='add'?`[data-action="add"][data-value="${v}"]`:'#no-motion-source'));const moveSlot=state.selection;
if(a==='cause'){const [q,c]=v.split(':').map(Number);state.answer[q]=c;}else if(a==='story'){if(state.selection===null)state.selection=+v;else{const i=state.selection;[state.answer[i],state.answer[+v]]=[state.answer[+v],state.answer[i]];state.selection=null;}}else if(a==='select'){state.selection=+v;}else if(a==='bin'){if(state.selection===null)return setStatus('Pilih satu kartu dulu, lalu rumahnya.');state.answer[state.selection]=+v;state.selection=null;setStatus('Kartu masuk rumah. Boleh dipindahkan lagi kalau berubah pikiran.');}else if(a==='pattern'){if(state.selection===null)return setStatus('Pilih gerbong yang kosong dulu.');state.answer[state.selection]=clone(m.choices[+v]);const empty=state.answer.findIndex(c=>!c);if(empty>=0)state.selection=empty;}else if(a==='tile'){if(state.selection===null)state.selection=+v;else{const i=state.selection;[state.answer[i],state.answer[+v]]=[state.answer[+v],state.answer[i]];state.selection=null;}}else if(a==='matrix'){if(state.selection===null||m.clues[state.selection]>=0)return setStatus('Pilih kotak tanpa gembok dulu.');state.answer[state.selection]=+v;}else if(a==='fixed')return setStatus('Kotak bergembok adalah petunjuk. Pilih kotak yang bisa kamu isi.');else if(a==='suspect'){state.answer=+v;state.crossed=(state.crossed||[]).filter(i=>i!==+v);}else if(a==='provision'){if(state.answer[+v]>=0){state.answer[+v]=-1;state.selection=null;}else state.selection=+v;}else if(a==='bag'){if(state.selection===null)return setStatus('Pilih satu bekal dulu, lalu pilih tas.');state.answer[state.selection]=+v;state.selection=null;}else if(a==='add'){if(state.program.length>=30)return setStatus('Rencananya sudah panjang. Hapus kartu atau gunakan Ulang.');state.program.push({type:v});state.active=-1;}else if(a==='remove'){state.program.splice(+v,1);state.active=-1;}else if(a==='undo')state.program.pop();else if(a==='clearProgram'){state.program=[];state.active=-1;}else if(a==='repeat'){if(!state.program.length)return setStatus('Susun pola pendek dulu, baru ketuk Ulang.');if(E.has(state.program,'repeat'))return setStatus('Untuk misi ini cukup satu lapis Ulang. Susun ulang jika ingin mengganti jumlahnya.');state.program=[{type:'repeat',count:+v,body:clone(state.program)}];}else if(a==='saveFn'){if(!state.program.length)return setStatus('Susun irama dulu, lalu simpan sebagai Jurus.');if(E.has(state.program,'function'))return setStatus('Buat jurus dari bunyi dan pengulangan, tanpa memanggil dirinya sendiri.');state.fn=clone(state.program);state.program=[];}else if(a==='callFn'){if(!state.fn.length)return setStatus('Simpan rangkaian bunyi menjadi Jurus dulu.');if(state.program.length>=30)return setStatus('Hapus beberapa kartu dulu.');state.program.push({type:'function',body:clone(state.fn)});}if(moveFrom){const keys={bin:'placed-sort-'+moveSlot,bag:'placed-packing-'+moveSlot,pattern:'pattern-'+moveSlot,matrix:'matrix-'+moveSlot};if(keys[a])GameMotion.seed(keys[a],moveFrom);else if(a==='add')GameMotion.seed(GameMotion.key(state.program[state.program.length-1]),moveFrom);}state.dotCount=0;renderGame();const motionTargets={bin:'.bin',bag:'.bag',suspect:'.suspect.selected',saveFn:'.function-box'};if(motionTargets[a]||['cause','story','tile','pattern','matrix','add','repeat','callFn','remove','undo','clearProgram','provision'].includes(a))setStatus('Sudah diubah! Menurutmu, sekarang sudah cocok? 🌱');if(motionTargets[a])animatePlay(motionTargets[a]);if(a==='cause')return check();}
dialog.addEventListener('close',()=>BimoVoice.stop());
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b&&!b.disabled)action(b.dataset.action,b.dataset.value);});$('#brand').onclick=e=>{e.preventDefault();home();};$('#mapBtn').onclick=home;$('#parentsBtn').onclick=parents;$('#soundBtn').onclick=()=>{sound=!sound;updateSound();if(sound)speak('Hai, aku Bimo! Siap main bersama? Yuk, kita coba!');else BimoVoice.stop();};home();
</script></body></html>
